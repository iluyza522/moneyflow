<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资金流观测台</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
  --bg: #f5f6fa;
  --surface: #ffffff;
  --surface2: #f8f9fc;
  --border: #e8eaef;
  --border-light: #eef0f4;
  --red: #c62a2e;
  --red-light: #fef2f2;
  --green: #0a8a3a;
  --green-light: #f0fdf4;
  --gold: #b8860b;
  --gold-light: #fffbeb;
  --text: #1a1a2e;
  --text2: #6b7280;
  --text3: #9ca3af;
  --serif: 'Noto Serif SC', 'Songti SC', Georgia, serif;
  --mono: 'JetBrains Mono', 'Sarasa Mono SC', monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --r: 10px;
  --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
  --shadow-hover: 0 4px 12px rgba(0,0,0,0.06), 0 2px 4px rgba(0,0,0,0.04);
}

*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg);color:var(--text)}
body{
  font-family:var(--sans);
  background:var(--bg);
  min-height:100vh;
  color:var(--text);
}
::selection{background:rgba(198,42,46,0.12);color:var(--red)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#9ca3af}

/* ── Header ── */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(24px) saturate(1.2);
  border-bottom:1px solid var(--border);
}
.header-bar{
  height:3px;
  background:linear-gradient(90deg,var(--red) 0%,var(--gold) 50%,var(--red) 100%);
  opacity:0.6;
}
.header-inner{
  max-width:1600px;margin:0 auto;
  padding:0 28px;
  height:60px;
  display:flex;align-items:center;gap:14px;
}
.header-brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.header-icon{
  width:32px;height:32px;
  background:var(--red);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
}
.header-icon svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.header-title{
  font-family:var(--serif);
  font-size:18px;font-weight:700;
  letter-spacing:0.03em;
  color:var(--text);
}
.header-title span{color:var(--red);}

.header-meta{
  display:flex;align-items:center;gap:10px;
  flex:1;justify-content:flex-end;
}

/* ── Inputs ── */
.input-line{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  padding:7px 14px;
  color:var(--text);
  font-size:13px;
  font-family:var(--mono);
  outline:none;
  transition:all 0.2s;
  width:170px;
}
.input-line::placeholder{color:var(--text3)}
.input-line:focus{
  border-color:var(--red);
  box-shadow:0 0 0 3px rgba(198,42,46,0.06);
}
.input-line.small{width:110px}

.btn{
  border:none;border-radius:8px;
  padding:7px 18px;
  font-size:13px;font-weight:500;
  font-family:var(--sans);
  cursor:pointer;
  transition:all 0.15s;
  white-space:nowrap;
}
.btn-primary{
  background:var(--red);
  color:#fff;
}
.btn-primary:hover{background:#b01d21;box-shadow:0 2px 8px rgba(198,42,46,0.2);}
.btn-ghost{
  background:var(--surface);
  color:var(--text2);
  border:1px solid var(--border);
}
.btn-ghost:hover{background:var(--surface2);border-color:#d1d5db;color:var(--text);}

select.input-line{
  appearance:none;
  width:auto;min-width:100px;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%236b7280' stroke-width='1.5' fill='none'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;
  padding-right:28px;cursor:pointer;
}

/* ── Status ── */
.status-bar{
  display:flex;align-items:center;gap:8px;
  padding:6px 0;height:28px;
  font-size:11px;color:var(--text3);
  font-family:var(--mono);
}
.status-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--green);
  transition:all 0.3s;
}
.status-dot.off{background:var(--text3)}

/* ── Container ── */
.container{max-width:1600px;margin:0 auto;padding:0 28px 40px}

/* ── Tabs ── */
.stock-tabs{
  display:flex;gap:4px;flex-wrap:wrap;
  margin-bottom:14px;
}
.stock-tab{
  display:flex;align-items:center;gap:5px;
  padding:6px 12px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  font-size:12px;cursor:pointer;
  transition:all 0.15s;
  font-family:var(--sans);
  user-select:none;
}
.stock-tab:hover{box-shadow:var(--shadow-hover);border-color:#d1d5db;}
.stock-tab.active{
  border-color:var(--red);
  background:var(--red-light);
  box-shadow:0 0 0 1px var(--red);
}
.stock-tab .name{font-weight:600;font-size:13px}
.stock-tab .code{color:var(--text3);font-size:11px;font-family:var(--mono)}
.stock-tab .close{
  width:16px;height:16px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--text3);
  cursor:pointer;transition:all 0.15s;
  margin-left:2px;
}
.stock-tab .close:hover{background:rgba(198,42,46,0.08);color:var(--red);}
.stock-tab .edit-btn{
  width:16px;height:16px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--text3);
  cursor:pointer;transition:all 0.15s;
}
.stock-tab .edit-btn:hover{background:rgba(184,134,11,0.08);color:var(--gold);}
.stock-tab.group-tab{border-color:#dbeafe}
.stock-tab.group-tab .name{color:#2563eb}
.stock-tab.group-tab .code{color:#93c5fd}
.stock-tab.group-tab.active{border-color:#3b82f6;background:#eff6ff}

/* ── Toolbar row ── */
.toolbar-row{
  display:flex;align-items:center;gap:24px;
  margin-bottom:14px;
  padding:10px 16px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  box-shadow:var(--shadow);
  flex-wrap:wrap;
}
.toolbar-section{
  display:flex;align-items:center;gap:8px;
  flex-wrap:wrap;
}
.toolbar-divider{
  width:1px;height:30px;
  background:var(--border);
  flex-shrink:0;
}
.toolbar-label{
  font-size:12px;color:var(--text3);
  white-space:nowrap;
}

/* ── Members bar ── */
.members-bar{
  margin-bottom:12px;font-size:11px;color:#2563eb;
  padding:8px 14px;
  background:#eff6ff;
  border-radius:8px;
  border:1px solid #dbeafe;
  font-family:var(--mono);
  line-height:1.6;
}

/* ── Summary ── */
.summary{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:16px}
.summary-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:16px 12px;text-align:center;
  box-shadow:var(--shadow);
  transition:all 0.15s;
}
.summary-card:hover{box-shadow:var(--shadow-hover);border-color:#d1d5db;}
.summary-card .label{
  font-size:11px;color:var(--text3);
  margin-bottom:6px;
  letter-spacing:0.03em;
}
.summary-card .value{
  font-size:18px;font-weight:600;
  font-family:var(--mono);
  letter-spacing:-0.02em;
}
.val-pos{color:var(--red)}
.val-neg{color:var(--green)}

/* ── Charts ── */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chart-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:18px;box-shadow:var(--shadow);
  transition:all 0.15s;
}
.chart-card:hover{box-shadow:var(--shadow-hover)}
.chart-card .chart-header{
  display:flex;align-items:center;gap:8px;
  margin-bottom:12px;
}
.chart-card .chart-title{
  font-size:13px;
  color:var(--text2);
  font-weight:500;
}
.chart-card .chart-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
}
.chart-card .chart-box{width:100%;height:320px;}

/* ── Empty / Loading ── */
.empty-state{
  text-align:center;
  padding:120px 20px;
  color:var(--text3);
}
.empty-state .icon-wrap{
  width:56px;height:56px;
  margin:0 auto 16px;
  border:1px solid var(--border);
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface);
}
.empty-state .icon-wrap svg{width:24px;height:24px;stroke:var(--text3);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.empty-state p{font-size:14px;color:var(--text2);}

.loading-overlay{
  text-align:center;padding:40px;display:none;
}
.loading-spinner{
  display:inline-block;width:24px;height:24px;
  border:2px solid var(--border);
  border-top-color:var(--red);
  border-radius:50%;
  animation:spin 0.7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{
  display:block;margin-top:8px;
  font-size:12px;color:var(--text3);
}

/* ── Ranking ── */
.ranking-view{display:none}
.ranking-header{
  display:flex;align-items:center;gap:14px;
  margin-bottom:14px;flex-wrap:wrap;
}
.ranking-header .title{
  font-family:var(--serif);
  font-size:16px;font-weight:700;
}
.ranking-header .title span{color:var(--red);}
.ranking-header .meta{font-size:12px;color:var(--text3);font-family:var(--mono);}
.ranking-header .spacer{flex:1}
.sort-btns{display:flex;gap:4px;flex-wrap:wrap}
.sort-btn{
  border:1px solid var(--border);
  background:var(--surface);
  border-radius:6px;
  padding:5px 10px;
  font-size:12px;
  font-family:var(--sans);
  cursor:pointer;
  transition:all 0.15s;
  color:var(--text2);
}
.sort-btn:hover{border-color:#d1d5db;color:var(--text)}
.sort-btn.active{
  background:var(--red-light);
  border-color:var(--red);
  color:var(--red);
  font-weight:500;
}
.ranking-wrap{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  overflow:auto;
  max-height:calc(100vh - 240px);
}
.ranking-table{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--mono);}
.ranking-table thead{position:sticky;top:0;z-index:2;}
.ranking-table th{
  background:#f0f1f5;
  border-bottom:1px solid var(--border);
  padding:8px 10px;text-align:right;
  font-weight:500;font-size:11px;
  color:var(--text2);
  cursor:pointer;white-space:nowrap;user-select:none;
}
.ranking-table th:first-child,.ranking-table th:nth-child(2),.ranking-table th:nth-child(3){text-align:left}
.ranking-table th:hover{background:#e8eaef;}
.ranking-table th .arrow{font-size:9px;margin-left:2px;opacity:0.3;}
.ranking-table th.sorted .arrow{opacity:1;color:var(--red);}
.ranking-table td{
  padding:7px 10px;text-align:right;
  border-bottom:1px solid var(--border-light);
  white-space:nowrap;
}
.ranking-table td:first-child{text-align:center;color:var(--text3);font-size:11px}
.ranking-table td:nth-child(2){text-align:left;font-weight:500;cursor:pointer;color:#2563eb;}
.ranking-table td:nth-child(2):hover{text-decoration:underline;}
.ranking-table td:nth-child(3){text-align:left;color:var(--text2);}
.ranking-table tr:hover td{background:rgba(0,0,0,0.01);}
.ranking-table tr:nth-child(1) td:first-child{color:var(--red);font-weight:700}
.ranking-table tr:nth-child(2) td:first-child{color:#6b7280;font-weight:600}
.ranking-table tr:nth-child(3) td:first-child{color:#b45309;font-weight:600}

/* ── Responsive ── */
@media(max-width:900px){
  .charts-grid{grid-template-columns:1fr}
  .chart-card .chart-box{height:260px}
  .summary{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:640px){
  .header-inner{padding:0 16px;height:auto;flex-wrap:wrap;padding-top:10px;padding-bottom:10px;gap:8px}
  .header-meta{width:100%;justify-content:flex-start}
  .container{padding:0 14px 40px}
  .input-line{width:130px}
  .summary{grid-template-columns:repeat(2,1fr)}
  .summary-card .value{font-size:15px}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-bar"></div>
  <div class="header-inner">
    <div class="header-brand">
      <div class="header-icon">
        <svg viewBox="0 0 24 24"><polyline points="22 7 18 7 15 16 9 2 6 11 2 11"/></svg>
      </div>
      <div class="header-title">资金流<span>观测台</span></div>
    </div>
    <div class="header-meta">
      <button class="btn btn-ghost" id="btnRanking" onclick="toggleRanking()">全市场</button>
      <select id="dateSelect" class="input-line" onchange="onDateChange()">
        <option value="">当天</option>
      </select>
      <a href="/logout" class="btn btn-ghost" style="text-decoration:none;font-size:12px">退出</a>
    </div>
  </div>
</div>

<div class="container">
  <div class="status-bar">
    <span class="status-dot off" id="statusDot"></span>
    <span id="statusText">等待加载...</span>
  </div>

  <div id="toolbarRow" class="toolbar-row">
    <div class="toolbar-section">
      <input id="codeInput" class="input-line" type="text" placeholder="输入股票代码" value="">
      <button class="btn btn-primary" onclick="addStock()">添加</button>
    </div>
    <div class="toolbar-divider"></div>
    <div class="toolbar-section">
      <span class="toolbar-label">创建指数</span>
      <input id="groupName" class="input-line small" type="text" placeholder="名称">
      <input id="groupCodes" class="input-line" type="text" placeholder="代码，逗号分隔" style="width:200px">
      <button class="btn btn-ghost" onclick="createGroup()">+ 创建</button>
    </div>
  </div>

  <div id="stockTabs" class="stock-tabs"></div>

  <div id="loading" class="loading-overlay">
    <span class="loading-spinner"></span>
    <span class="loading-text">加载中...</span>
  </div>

  <div id="emptyState" class="empty-state">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polygon points="10,8 16,12 10,16"/></svg>
    </div>
    <p>添加股票，查看实时资金流向</p>
  </div>

  <div id="summaryArea" class="summary" style="display:none"></div>

  <div id="chartArea" style="display:none">
    <div id="groupMembers" class="members-bar" style="display:none"></div>
    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-header">
          <span class="chart-dot" style="background:var(--red);box-shadow:0 0 6px rgba(198,42,46,0.15)"></span>
          <span class="chart-title" id="chartTitle1">涨跌幅 &amp; 主力净流入</span>
        </div>
        <div id="chartPrice" class="chart-box"></div>
      </div>
      <div class="chart-card">
        <div class="chart-header">
          <span class="chart-dot" style="background:var(--gold);box-shadow:0 0 6px rgba(184,134,11,0.15)"></span>
          <span class="chart-title" id="chartTitle2">资金流明细</span>
        </div>
        <div id="chartFlow" class="chart-box"></div>
      </div>
    </div>
  </div>

  <div id="rankingView" class="ranking-view">
    <div class="ranking-header">
      <span class="title">全市场<span>资金流</span></span>
      <span class="meta" id="rankingDt"></span>
      <span class="meta" id="rankingTotal"></span>
      <span class="spacer"></span>
      <div class="sort-btns" id="sortBtns"></div>
    </div>
    <div class="ranking-wrap">
      <table class="ranking-table">
        <thead id="rankingHead"></thead>
        <tbody id="rankingBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
var $=function(id){return document.getElementById(id)};
var stocks={},activeCode=null,chartPrice=null,chartFlow=null,refreshTimer=null,currentDate='';

function fmt(v){
  var a=Math.abs(v);
  if(a>=1e8)return(v/1e8).toFixed(2)+'亿';
  if(a>=1e4)return(v/1e4).toFixed(0)+'万';
  return v.toLocaleString();
}
function fmtPct(v){return v.toFixed(4)+'%'}
function cls(v){return v>=0?'val-pos':'val-neg'}
function setStatus(t,a){$('statusText').textContent=t;$('statusDot').className='status-dot'+(a?'':' off')}
function onDateChange(){currentDate=$('dateSelect').value;if(activeCode)refreshActive()}

async function loadDates(code){
  try{
    var r=await fetch('/api/dates?code='+encodeURIComponent(code)),d=await r.json(),s=$('dateSelect');
    s.innerHTML='<option value="">当天</option>';
    if(d.length>1){
      d.forEach(function(x){var o=document.createElement('option');o.value=x;o.textContent=x;if(x===currentDate)o.selected=true;s.appendChild(o)});
      var a=document.createElement('option');a.value='all';a.textContent='全部';if(currentDate==='all')a.selected=true;s.appendChild(a);
    }
  }catch(e){}
}

function addStock(){
  var c=$('codeInput').value.trim();
  if(!c)return;
  if(stocks[c]){switchStock(c);return}
  $('codeInput').value='';
  fetchStock(c);
}
async function fetchStock(code){
  $('loading').style.display='block';
  try{
    var r=await fetch('/api/stocks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code})}),pd=await r.json();
    if(!r.ok||pd.error){alert(pd.error||'添加失败');return}
    var u='/api/intraday?code='+encodeURIComponent(pd.code);
    if(currentDate==='all')u+='&date=';else if(currentDate)u+='&date='+encodeURIComponent(currentDate);
    var r2=await fetch(u),d=await r2.json();
    if(!r2.ok||d.error){alert(d.error||'获取失败');return}
    stocks[d.code]=d;renderTabs();switchStock(d.code);setStatus('已添加 '+d.name,true);loadDates(d.code);
  }catch(e){alert('网络错误: '+e.message)}finally{$('loading').style.display='none'}
}
function removeStock(code,e){
  e.stopPropagation();
  fetch('/api/stocks/'+code,{method:'DELETE'});
  delete stocks[code];
  if(activeCode===code){var ks=Object.keys(stocks);activeCode=ks.length>0?ks[0]:null}
  renderTabs();if(activeCode)switchStock(activeCode);else hideAll();
}
function renameStock(code,n){
  stocks[code].name=n;
  fetch('/api/stocks/'+code+'/name',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});
  renderTabs();if(activeCode===code)renderChart(code);
}

function renderTabs(){
  var c=$('stockTabs');
  while(c.firstChild)c.removeChild(c.firstChild);
  Object.keys(stocks).forEach(function(code){
    var s=stocks[code];if(s.is_group)return;
    var t=document.createElement('div');t.className='stock-tab'+(code===activeCode?' active':'');t.onclick=function(){switchStock(code)};
    var e=document.createElement('span');e.className='edit-btn';e.textContent='✎';e.title='改名';
    var n=document.createElement('span');n.className='name';n.textContent=s.name;
    e.onclick=function(ev){
      ev.stopPropagation();
      var inp=document.createElement('input');inp.type='text';inp.value=s.name;
      inp.style.cssText='width:80px;background:#fff;border:1px solid var(--red);border-radius:4px;padding:2px 6px;color:var(--text);font-size:13px;font-family:var(--sans);outline:none;box-shadow:0 0 0 2px rgba(198,42,46,0.08)';
      n.replaceWith(inp);inp.focus();inp.select();
      var done=function(){renameStock(code,inp.value.trim()||s.name)};
      inp.onblur=done;inp.onkeydown=function(ev2){if(ev2.key==='Enter')inp.blur();if(ev2.key==='Escape'){inp.value=s.name;inp.blur()}};
    };
    t.appendChild(e);t.appendChild(n);
    var cc=document.createElement('span');cc.className='code';cc.textContent=s.code;t.appendChild(cc);
    var x=document.createElement('span');x.className='close';x.textContent='×';x.onclick=function(ev){removeStock(code,ev)};t.appendChild(x);
    c.appendChild(t);
  });
  (window._groups||[]).forEach(function(g){
    var k='group_'+g.id,t=document.createElement('div');t.className='stock-tab group-tab'+(k===activeCode?' active':'');
    t.title=(g.code_names?g.codes.map(function(c){return(g.code_names[c]||c)+'('+c+')'}).join('\n'):g.codes.join(', '));
    t.onclick=function(){loadGroupFlow(g.id,g.name)};
    var n=document.createElement('span');n.className='name';n.textContent=g.name;t.appendChild(n);
    var cc=document.createElement('span');cc.className='code';cc.textContent=g.codes.length+'只';t.appendChild(cc);
    var x=document.createElement('span');x.className='close';x.textContent='×';
    x.onclick=function(ev){ev.stopPropagation();if(confirm('删除指数 "'+g.name+'"？')){fetch('/api/groups/'+g.id,{method:'DELETE'}).then(loadGroups);delete stocks[k];if(activeCode===k){var ks=Object.keys(stocks);activeCode=ks.length>0?ks[0]:null;renderTabs();if(activeCode)switchStock(activeCode);else hideAll()}}};
    t.appendChild(x);c.appendChild(t);
  });
}
function hideAll(){
  $('emptyState').style.display='block';$('chartArea').style.display='none';$('summaryArea').style.display='none';
  if(chartPrice){chartPrice.dispose();chartPrice=null}if(chartFlow){chartFlow.dispose();chartFlow=null}
}
function switchStock(code){
  activeCode=code;renderTabs();renderChart(code);renderSummary(code);
  if(stocks[code]&&stocks[code].is_group){var s=$('dateSelect');s.innerHTML='<option value="">当天</option><option value="all">全部</option>';currentDate=''}
  else loadDates(code);
}

function renderSummary(code){
  var s=stocks[code];if(!s||!s.main_net||!s.main_net.length)return;
  var last=s.main_net.length-1;
  var ig=s.is_group;

  // 算涨跌幅百分比
  var changePct=0;
  if(s.prices&&s.prices.length>1){
    var firstP=null,lastP=null;
    for(var pi=0;pi<s.prices.length;pi++){if(s.prices[pi]!=null&&s.prices[pi]>0){firstP=s.prices[pi];break}}
    for(var pi=s.prices.length-1;pi>=0;pi--){if(s.prices[pi]!=null&&s.prices[pi]>0){lastP=s.prices[pi];break}}
    if(firstP!=null&&lastP!=null)changePct=(lastP-firstP)/firstP*100;
  }

  // 最新价
  var lastPrice=0;
  if(s.prices){for(var pi=s.prices.length-1;pi>=0;pi--){if(s.prices[pi]!=null&&s.prices[pi]>0){lastPrice=s.prices[pi];break}}}

  var items=[
    {label:'最新价',value:lastPrice,isPrice:true},
    {label:'涨跌幅',value:changePct,isPct:true},
    {label:'主力净流入',value:s.main_net[last]},{label:'超大单',value:s.super_large_net[last]},
    {label:'大单',value:s.large_net[last]},{label:'中单',value:s.medium_net[last]},{label:'小单',value:s.small_net[last]}
  ];
  var a=$('summaryArea');
  while(a.firstChild)a.removeChild(a.firstChild);
  items.forEach(function(item){
    var c=document.createElement('div');c.className='summary-card';
    var l=document.createElement('div');l.className='label';l.textContent=item.label;
    var v=document.createElement('div');
    if(item.isPrice){
      v.className='value';v.textContent=item.value>0?item.value.toFixed(2):'--';v.style.color='var(--gold)';
    }else if(item.isPct){
      v.className='value'+((item.value>=0)?' val-pos':' val-neg');
      v.textContent=item.value.toFixed(2)+'%';
    }else{v.className='value '+cls(item.value);v.textContent=ig?fmtPct(item.value):fmt(item.value)}
    c.appendChild(l);c.appendChild(v);a.appendChild(c);
  });
  $('summaryArea').style.display='grid';
}

function renderChart(code){
  var s=stocks[code];if(!s)return;
  var ig=s.is_group;
  $('chartTitle1').textContent=s.name+(ig?' 等权涨跌幅 & 主力净流入':' 涨跌幅 & 主力净流入');
  $('chartTitle2').textContent=s.name+' 资金流明细';
  $('emptyState').style.display='none';
  var gm=$('groupMembers');
  if(ig){var g=(window._groups||[]).find(function(x){return'group_'+x.id===code});if(g){var ns=g.code_names||{};gm.textContent='成分股: '+g.codes.map(function(c){return(ns[c]||c)+'('+c+')'}).join('  ');gm.style.display='block'}}
  else gm.style.display='none';
  $('chartArea').style.display='block';
  if(chartPrice)chartPrice.dispose();if(chartFlow)chartFlow.dispose();
  chartPrice=echarts.init($('chartPrice'));chartFlow=echarts.init($('chartFlow'));

  var pricePct=[];
  if(ig)pricePct=s.prices||[];
  else if(s.prices&&s.prices.length>0){
    var openP=null;
    for(var pi=0;pi<s.prices.length;pi++){if(s.prices[pi]!=null&&s.prices[pi]>0){openP=s.prices[pi];break}}
    if(openP)pricePct=s.prices.map(function(p){return(p!=null&&p>0)?((p-openP)/openP*100):null});
  }

  var labelInt=s.times.length>200?59:29;
  var multiDay=s.times.length>0&&s.times[0].indexOf(' ')!==-1;
  var baseX={
    type:'category',data:s.times,boundaryGap:false,
    axisLabel:{color:'#9ca3af',fontSize:10,interval:labelInt,formatter:function(v,i){if(multiDay){if(i===s.times.length-1)return v;return v.split(' ')[0]}return v}},
    axisLine:{lineStyle:{color:'rgba(0,0,0,0.06)'}},
    axisTick:{alignWithLabel:true}
  };

  chartPrice.setOption({
    tooltip:{
      trigger:'axis',
      backgroundColor:'rgba(255,255,255,0.96)',
      borderColor:'rgba(0,0,0,0.08)',
      textStyle:{color:'#1a1a2e',fontSize:11,fontFamily:'"JetBrains Mono",monospace'},
      extraCssText:'box-shadow:0 4px 16px rgba(0,0,0,0.08);border-radius:8px;padding:8px 12px',
      formatter:function(params){
        var t=params[0].axisValue+'<br/>';
        params.forEach(function(p){
          var val;
          if(p.seriesName==='涨跌幅'||p.seriesName==='等权涨跌幅')val=p.value.toFixed(2)+'%';
          else if(ig)val=fmtPct(p.value);
          else val=fmt(p.value);
          t+=p.marker+' '+p.seriesName+': <b>'+val+'</b><br/>';
        });
        return t;
      }
    },
    legend:{data:[ig?'等权涨跌幅':'涨跌幅','主力净流入'],textStyle:{color:'#6b7280',fontSize:10},top:6,right:10},
    grid:{left:65,right:70,top:36,bottom:30},
    xAxis:baseX,
    yAxis:[
      {type:'value',name:ig?'主力(占市值%)':'主力净流入',nameTextStyle:{color:'#9ca3af',fontSize:9},axisLabel:{color:'#9ca3af',fontSize:9,formatter:function(v){return ig?v.toFixed(4)+'%':fmt(v)}},splitLine:{lineStyle:{color:'rgba(0,0,0,0.04)'}}},
      {type:'value',axisLabel:{color:'#9ca3af',fontSize:9,formatter:function(v){return v.toFixed(1)+'%'}},splitLine:{show:false}}
    ],
    series:[
      {name:ig?'等权涨跌幅':'涨跌幅',type:'line',data:pricePct,yAxisIndex:1,lineStyle:{width:2,color:'#b8860b'},symbol:'none',itemStyle:{color:'#b8860b'},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(184,134,11,0.08)'},{offset:1,color:'rgba(184,134,11,0)'}])}},
      {name:'主力净流入',type:'line',data:s.main_net,yAxisIndex:0,lineStyle:{width:2,color:'#c62a2e'},symbol:'none',itemStyle:{color:'#c62a2e'},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(198,42,46,0.06)'},{offset:1,color:'rgba(198,42,46,0)'}])}}
    ]
  });

  chartFlow.setOption({
    tooltip:{
      trigger:'axis',
      backgroundColor:'rgba(255,255,255,0.96)',
      borderColor:'rgba(0,0,0,0.08)',
      textStyle:{color:'#1a1a2e',fontSize:11,fontFamily:'"JetBrains Mono",monospace'},
      extraCssText:'box-shadow:0 4px 16px rgba(0,0,0,0.08);border-radius:8px;padding:8px 12px',
      formatter:function(params){
        var t=params[0].axisValue+'<br/>';
        params.forEach(function(p){
          var val=ig?fmtPct(p.value):fmt(p.value);
          t+=p.marker+' '+p.seriesName+': <b>'+val+'</b><br/>';
        });
        return t;
      }
    },
    legend:{data:['超大单','大单','中单','小单'],textStyle:{color:'#6b7280',fontSize:10},top:0,right:0},
    grid:{left:65,right:65,top:34,bottom:30},
    xAxis:baseX,
    yAxis:{type:'value',name:ig?'占市值%':'',nameTextStyle:{color:'#9ca3af',fontSize:9},axisLabel:{color:'#9ca3af',fontSize:9,formatter:function(v){return ig?v.toFixed(4)+'%':fmt(v)}},splitLine:{lineStyle:{color:'rgba(0,0,0,0.04)'}}},
    series:[
      {name:'超大单',type:'line',data:s.super_large_net,lineStyle:{width:1.5,color:'#c62a2e'},symbol:'none',itemStyle:{color:'#c62a2e'},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(198,42,46,0.05)'},{offset:1,color:'rgba(198,42,46,0)'}])}},
      {name:'大单',type:'line',data:s.large_net,lineStyle:{width:1.5,color:'#3b82f6'},symbol:'none',itemStyle:{color:'#3b82f6'},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(59,130,246,0.05)'},{offset:1,color:'rgba(59,130,246,0)'}])}},
      {name:'中单',type:'line',data:s.medium_net,lineStyle:{width:1,color:'#a78bfa'},symbol:'none',itemStyle:{color:'#a78bfa'},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(167,139,250,0.04)'},{offset:1,color:'rgba(167,139,250,0)'}])}},
      {name:'小单',type:'line',data:s.small_net,lineStyle:{width:1,color:'#34d399'},symbol:'none',itemStyle:{color:'#34d399'},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(52,211,153,0.04)'},{offset:1,color:'rgba(52,211,153,0)'}])}}
    ]
  });
  window.addEventListener('resize',function(){chartPrice&&chartPrice.resize();chartFlow&&chartFlow.resize()});
}

async function createGroup(){
  var n=$('groupName').value.trim(),cs=$('groupCodes').value.trim();
  if(!n||!cs){alert('请输入名称和股票代码');return}
  var codes=cs.split(/[,，\s]+/).filter(function(c){return c.trim()});
  if(!codes.length){alert('至少一只股票');return}
  try{
    var r=await fetch('/api/groups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,codes:codes})}),d=await r.json();
    if(!r.ok||d.error){alert(d.error||'创建失败');return}
    $('groupName').value='';$('groupCodes').value='';loadGroups();
  }catch(e){alert('网络错误: '+e.message)}
}
async function loadGroups(){try{var r=await fetch('/api/groups'),d=await r.json();window._groups=d;renderTabs()}catch(e){}}
async function loadGroupFlow(gid,name){
  var k='group_'+gid;
  try{
    var u='/api/groups/'+gid+'/flow';if(currentDate==='all')u+='?date=';else if(currentDate)u+='?date='+encodeURIComponent(currentDate);
    var r=await fetch(u),d=await r.json();
    if(!r.ok||d.error){alert(d.error||'获取失败');return}
    stocks[k]=d;renderTabs();switchStock(k);
  }catch(e){alert('网络错误: '+e.message)}
}

var rankingVisible=false,rankingSort='main_net',rankingOrder='desc',rankingData=null;
var RANKING_SORTS=[
  {key:'main_net',label:'主力净流入'},{key:'super_large_net',label:'超大单'},{key:'large_net',label:'大单'},
  {key:'medium_net',label:'中单'},{key:'small_net',label:'小单'},{key:'change_pct',label:'涨跌幅'},{key:'main_ratio',label:'主力占比'}
];
var RANKING_COLS=[
  {key:'rank',label:'#',fmt:function(v){return v}},
  {key:'code',label:'代码',fmt:function(v){return v}},
  {key:'name',label:'名称',fmt:function(v){return v}},
  {key:'price',label:'价格',fmt:function(v){return v!=null?v.toFixed(2):'--'}},
  {key:'change_pct',label:'涨跌幅',fmt:function(v){return v!=null?v.toFixed(2)+'%':'--'},cls:true},
  {key:'main_net',label:'主力净流入',fmt:function(v){return v!=null?fmt(v):'--'},cls:true},
  {key:'super_large_net',label:'超大单',fmt:function(v){return v!=null?fmt(v):'--'},cls:true},
  {key:'large_net',label:'大单',fmt:function(v){return v!=null?fmt(v):'--'},cls:true},
  {key:'medium_net',label:'中单',fmt:function(v){return v!=null?fmt(v):'--'},cls:true},
  {key:'small_net',label:'小单',fmt:function(v){return v!=null?fmt(v):'--'},cls:true},
  {key:'main_ratio',label:'主力占比',fmt:function(v){return v!=null?v.toFixed(2)+'%':'--'},cls:true}
];
function toggleRanking(){rankingVisible?hideRanking():showRanking()}
function showRanking(){
  rankingVisible=true;$('btnRanking').textContent='返回';$('rankingView').style.display='block';
  $('chartArea').style.display='none';$('summaryArea').style.display='none';$('emptyState').style.display='none';
  $('dateSelect').style.display='none';$('stockTabs').style.display='none';
  renderSortBtns();loadRanking();
}
function hideRanking(){
  rankingVisible=false;$('btnRanking').textContent='全市场';$('rankingView').style.display='none';
  $('dateSelect').style.display='';$('stockTabs').style.display='';
  if(activeCode)switchStock(activeCode);else hideAll();
}
function renderSortBtns(){
  var c=$('sortBtns');while(c.firstChild)c.removeChild(c.firstChild);
  RANKING_SORTS.forEach(function(s){
    var b=document.createElement('button');b.className='sort-btn'+(s.key===rankingSort?' active':'');b.textContent=s.label;
    b.onclick=function(){if(rankingSort===s.key)rankingOrder=rankingOrder==='desc'?'asc':'desc';else{rankingSort=s.key;rankingOrder='desc'}renderSortBtns();loadRanking()};c.appendChild(b);
  });
}
function renderRankingHead(){
  var h=$('rankingHead');h.innerHTML='';var tr=document.createElement('tr');
  RANKING_COLS.forEach(function(col){
    var th=document.createElement('th');var sorted=col.key===rankingSort;
    if(sorted)th.className='sorted';var arrow=sorted?((rankingOrder==='desc'?'▼':'▲')):'';
    th.innerHTML=col.label+'<span class="arrow">'+arrow+'</span>';
    if(col.key!=='rank'&&col.key!=='code'&&col.key!=='name')th.onclick=function(){if(rankingSort===col.key)rankingOrder=rankingOrder==='desc'?'asc':'desc';else{rankingSort=col.key;rankingOrder='desc'}renderSortBtns();loadRanking()};
    tr.appendChild(th);
  });h.appendChild(tr);
}
function renderRankingBody(){
  var b=$('rankingBody');b.innerHTML='';
  if(!rankingData||!rankingData.rows)return;
  rankingData.rows.forEach(function(row,idx){
    var tr=document.createElement('tr');
    RANKING_COLS.forEach(function(col){
      var td=document.createElement('td');var val=col.key==='rank'?(idx+1):row[col.key];td.textContent=col.fmt(val);
      if(col.cls&&val!=null)td.className=cls(typeof val==='string'?parseFloat(val):val);
      if(col.key==='code')td.onclick=function(){var c=row.code;if(stocks[c]){hideRanking();switchStock(c)}else{hideRanking();$('codeInput').value=c;addStock()}};
      tr.appendChild(td);
    });b.appendChild(tr);
  });
}
async function loadRanking(){
  try{
    var u='/api/market_flow?sort='+encodeURIComponent(rankingSort)+'&order='+encodeURIComponent(rankingOrder)+'&limit=200';
    var r=await fetch(u),d=await r.json();
    if(!r.ok||d.error){$('rankingDt').textContent=d.error||'加载失败';$('rankingTotal').textContent='';return}
    rankingData=d;$('rankingDt').textContent=d.dt?'快照: '+d.dt:'暂无数据';$('rankingTotal').textContent=d.total?'共 '+d.total+' 只':'';
    renderRankingHead();renderRankingBody();
  }catch(e){$('rankingDt').textContent='网络错误';$('rankingTotal').textContent=''}
}

async function refreshActive(){
  // 同步其他用户添加的股票
  try{
    var r=await fetch('/api/stocks'),list=await r.json();
    if(r.ok&&list){var hasNew=false;
      for(var i=0;i<list.length;i++){if(!stocks[list[i].code]){try{var dr=await fetch('/api/intraday?code='+encodeURIComponent(list[i].code));var d=await dr.json();if(dr.ok&&!d.error){stocks[d.code]=d;hasNew=true}}catch(e){}}
      }if(hasNew){renderTabs();if(!activeCode||!stocks[activeCode]){var ks=Object.keys(stocks);if(ks.length>0)switchStock(ks[0])}}
    }
  }catch(e){}
  if(rankingVisible){await loadRanking();setStatus('排名已刷新: '+new Date().toLocaleTimeString(),true);return}
  if(!activeCode)return;
  try{
    var data;
    if(activeCode.startsWith('group_')){
      var gid=activeCode.replace('group_',''),u='/api/groups/'+gid+'/flow';
      if(currentDate==='all')u+='?date=';else if(currentDate)u+='?date='+encodeURIComponent(currentDate);
      var r=await fetch(u);data=await r.json();if(!r.ok||data.error)return;
    }else{
      var u2='/api/intraday?code='+encodeURIComponent(activeCode);
      if(currentDate==='all')u2+='&date=';else if(currentDate)u2+='&date='+encodeURIComponent(currentDate);
      var r2=await fetch(u2);data=await r2.json();if(!r2.ok||data.error)return;
    }
    stocks[data.code]=data;renderChart(data.code);renderSummary(data.code);
    setStatus('最后更新: '+new Date().toLocaleTimeString(),true);
  }catch(e){setStatus('刷新失败',false)}
}
function startAutoRefresh(){if(refreshTimer)clearInterval(refreshTimer);refreshTimer=setInterval(refreshActive,60000)}

$('codeInput').addEventListener('keydown',function(e){if(e.key==='Enter')addStock()});
$('groupCodes').addEventListener('keydown',function(e){if(e.key==='Enter')createGroup()});

(async function(){
  try{
    var r=await fetch('/api/stocks'),list=await r.json();
    if(!list.length){$('codeInput').value='600519';addStock()}
    else{
      setStatus('加载 '+list.length+' 只股票...',true);
      for(var i=0;i<list.length;i++){try{var dr=await fetch('/api/intraday?code='+encodeURIComponent(list[i].code));var d=await dr.json();if(dr.ok&&!d.error)stocks[d.code]=d}catch(e){}}
      renderTabs();var codes=Object.keys(stocks);if(codes.length>0)switchStock(codes[0]);setStatus('已加载 '+codes.length+' 只股票',true);
    }
  }catch(e){setStatus('加载失败',false)}
  loadGroups();startAutoRefresh();
})();
</script>
</body>
